/* layout: one narrow column, big thumb-sized buttons, sketchbook-paper feel */
:root{--bg:#f6f4ee;--fg:#1c1b22;--mute:#5d5b66;--line:#1c1b22;--btn:#86d9f2;--btn2:#fffdf8;--ok:#1fae55;--bad:#c2255c;--font:"Yomogi","Zen Kurenaido","Hiragino Maru Gothic ProN",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161c;--fg:#f1eee6;--mute:#a8a5b2;--line:#f1eee6;--btn:#2f6f86;--btn2:#23222a;--ok:#46d27c;--bad:#ff7aa8;color-scheme:dark}}

main{max-width:30rem;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:26px;line-height:1.35;margin:0;text-wrap:balance}
p{margin:0}
.mute{color:var(--mute);font-size:15px}
button{font:inherit;color:var(--fg);cursor:pointer;border:2.5px solid var(--line);border-radius:14px 10px 16px 9px;padding:16px 18px;text-align:left;background:var(--btn2);min-height:64px}
button.main{background:var(--btn);font-size:21px}
button small{display:block;color:var(--mute);font-size:14px}
button:focus-visible{outline:3px solid var(--ok);outline-offset:3px}
#msg{min-height:1.7em;font-size:16px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
ol{margin:0;padding-left:1.3em}
</style>

<main>
<h1>ゲームのファイルを保存する</h1>
<p>保存したいファイルのボタンを押します。ゲームの更新は index.html、ポートフォリオの更新は portfolio.html です。</p>

<button class="main" id="bPf" type="button">portfolio.html を保存<small>ポートフォリオのページ</small></button>
</div>

<p id="none" class="bad" hidden>この画面ではファイルを保存できません。Claudeアプリでこのページを開いてください。</p>

<ol class="mute">

</ol>
</section>

  const go=async(name,key)=>{
    msg.className='';msg.textContent='';
    try{await dl.save({filename:name,data:bytes(D[key])});msg.className='ok';msg.textContent=name+' を保存しました。'}
    catch(e){msg.className='bad';msg.textContent=e&&e.code==='declined'?'保存をやめました。もう一度押せます。':'保存できませんでした('+((e&&e.code)||'error')+')。'}
  };
  document.getElementById('bGame').onclick=()=>go('index.html','game');
  document.getElementById('bPf').onclick=()=>go('portfolio.html','portfolio');
})();
</script>

</body></html>
